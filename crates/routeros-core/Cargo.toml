[package]
name = "routeros-core"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = "1"
serde_json = "1"
# Native, strictly read-only RouterOS REST HTTPS transport; not API-SSL 8729.
tokio = { version = "1", features = ["net", "time", "io-util", "rt-multi-thread", "macros"] }
tokio-rustls = "=0.26.5"
rustls = "=0.23.45"
sha2 = "=0.11.0"
base64 = "=0.22.1"
libc = "=0.2.189"
