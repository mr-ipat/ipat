name: Rust workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust and rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Validate lab bootstrap scripts (syntax only)
        run: |
          bash -n deploy/scripts/lab/stage1-root-preflight-and-toolchain.sh
          bash -n deploy/scripts/lab/apply-stage1-from-mac.sh
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run locked unit tests
        run: cargo test --workspace --locked
