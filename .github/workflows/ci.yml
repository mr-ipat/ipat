name: Rust workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust and rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      # TEMPORARY parser-branch lock refresh; remove after Cargo.lock is committed.
      - name: Resolve parser dependency in disposable CI runner
        run: cargo generate-lockfile
      - name: Export refreshed Cargo.lock for branch commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cwmp-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run locked unit tests
        run: cargo test --workspace --locked
