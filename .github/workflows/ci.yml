name: Rust workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust and rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Validate lab bootstrap scripts and reviewed root digest
        run: |
          bash -n deploy/scripts/lab/stage1-root-preflight-and-toolchain.sh
          bash -n deploy/scripts/lab/apply-stage1-from-mac.sh
          expected=c2f65afb09d0a8f2509f8e6e27530e5d3d7c1c692f502513835620738414e8e4
          actual="$(sha256sum deploy/scripts/lab/stage1-root-preflight-and-toolchain.sh | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          grep -Fq "$expected" deploy/scripts/lab/apply-stage1-from-mac.sh
      - name: Verify lab Stage-2 static safety contract
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_stage2_review.py' -v
      - name: Verify rootless K3s readiness script (static tests only)
        run: |
          bash -n deploy/scripts/lab/k3s-readonly-preflight.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_readonly_review.py' -v
      - name: Verify disposable Ubuntu 26 K3s isolation contracts
        run: |
          bash -n deploy/scripts/lab/k3s-ubuntu26-ephemeral-ci.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_ubuntu26_ephemeral_review.py' -v
      - name: Verify R5.7 cross-host K3s restore and precise nft rollback contracts
        run: |
          bash -n deploy/scripts/lab/r57/source-systemd-k3s.sh
          bash -n deploy/scripts/lab/r57/restore-systemd-k3s.sh
          bash -n deploy/scripts/lab/r57/nft-rollback-drill.sh
          python3 -m unittest discover deploy/scripts/lab/r57 -p 'test_r57_review.py' -v
      - name: Verify R5.8 private Helm app packaging and fail-closed CI scope
        run: |
          bash -n deploy/scripts/lab/r58/app-smoke.sh
          python3 -m py_compile deploy/scripts/lab/r58/verify-rendered.py
          python3 -m unittest discover deploy/scripts/lab/r58 -p 'test_r58_review.py' -v
      - name: Verify R5.9 SSH-loopback-only web preview and negative deployment guards
        run: |
          bash -n deploy/scripts/lab/r59/start-private-web-mac.sh
          bash -n deploy/scripts/lab/r59/stop-private-web-mac.sh
          python3 -m unittest discover deploy/scripts/lab/r59 -p 'test_r59_review.py' -v
      - name: Verify R6.0 physical-device intake is offline and no compatibility is inferred
        run: |
          python3 -m py_compile deploy/scripts/lab/r60/prepare-device-intake.py
          python3 -m json.tool web/lab/device-targets.json >/dev/null
          python3 -m unittest discover deploy/scripts/lab/r60 -p 'test_r60_review.py' -v
      - name: Verify R6.1 exact owner-reported MikroTik and safe first read-only REST tool
        run: |
          python3 -m py_compile deploy/scripts/lab/r61/readonly-rest-probe.py
          python3 -m unittest discover deploy/scripts/lab/r61 -p 'test_r61*.py' -v
      - name: Verify Mac encrypted-backup and external provider probe safety contracts (static)
        run: |
          bash -n deploy/scripts/lab/backup-mac-restic.sh
          bash -n deploy/scripts/lab/external-readonly-network-check.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_backup_mac_review.py' -v
          python3 -m unittest discover deploy/scripts/lab -p 'test_external_network_review.py' -v
      - name: Verify external provider R4.6 FileVault and dual-stack safety preflight (static)
        run: |
          bash -n deploy/scripts/lab/edge-r46-gate-check.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_edge_r46_gate_review.py' -v
      - name: R9.73 platform-only suspended tenant reservation SQL and role contract
        run: |
          bash -n deploy/db/tests/r973_docker_repro.sh
          python3 -m py_compile deploy/db/tests/test_platform_tenant_onboarding_integration.py
          grep -Fq 'TO ipat_platform_onboard_exec' deploy/db/migrations/0026_platform_tenant_onboarding.sql
      - name: R9.72 scoped NOC read-only tenant console source and SQL contract
        run: |
          node --check web/console/tenant/app.js
          node deploy/scripts/lab/r970/test_tenant_dashboard_contract.cjs
          bash -n deploy/db/tests/r972_docker_repro.sh
          python3 -m py_compile deploy/db/tests/test_noc_scope_integration.py
          grep -Fq "noc_pops" apps/control-api/src/commercial_tenant_api.rs
          grep -Fq "TO ipat_tenant_api_exec" deploy/db/migrations/0025_commercial_noc_scopes.sql
      - name: R9.71 isolated one-use OIDC pending-state SQL and Rust security contract
        run: |
          bash -n deploy/db/tests/r971_docker_repro.sh
          python3 -m py_compile deploy/db/tests/test_oidc_pending_integration.py
          grep -Fq 'IPAT_R971_DURABLE_PENDING' apps/control-api/src/commercial_oidc_issuer.rs
          grep -Fq 'consume_oidc_pending' deploy/db/migrations/0024_oidc_one_time_pending.sql
      - name: R9.70 confidential OIDC and role-hidden tenant dashboard browser source (NO real IdP)
        run: |
          node --check web/console/tenant/app.js
          node deploy/scripts/lab/r970/test_tenant_dashboard_contract.cjs
          node --check deploy/scripts/lab/r970/owner_mac_synthetic_chrome_acceptance.cjs
          bash -n deploy/db/tests/r970_docker_repro.sh
          bash -n deploy/scripts/production/r970_runtime_failclosed_smoke.sh
          python3 -m py_compile deploy/db/tests/test_tenant_menu_entitlements_integration.py
          grep -Fq 'R9.70' docs/PRD.md
          grep -Fq 'R9.70' docs/PRD_AUDIT_MATRIX.md
      - name: Verify root-config encrypted stream scripts (static contract)
        run: |
          bash -n deploy/scripts/lab/mac-root-config-backup.sh
          python3 -m py_compile deploy/scripts/lab/root-config-stream.py
          python3 -m unittest discover deploy/scripts/lab -p 'test_root_config_stream_review.py' -v
      - name: Verify sealed offline CWMP admission boundary (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_cwmp_admission_review.py' -v
      - name: Verify synthetic USP Controller sealed trust and loopback only (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_usp_synthetic_review.py' -v
      - name: R8.1 real BBF USP 1.4 native protobuf wire GET/GET_RESP strict offline plus real private Axum HTTP
        run: |
          python3 deploy/scripts/lab/r81/generate_golden_usp.py
          python3 -m unittest discover deploy/scripts/lab/r81 -p 'test_*.py' -v
          bash -n deploy/scripts/lab/r81/usp14-private-http-smoke.sh
          cargo test --locked -p usp-core --test usp14_wire
          cargo test --locked -p usp-controller
          cargo build --locked -p usp-controller
          IPAT_R81_SYNTHETIC_HTTP=YES bash deploy/scripts/lab/r81/usp14-private-http-smoke.sh
      - name: R8.2 original CWMP 1.0 actual SOAP virtual ONT HTTP Inform and fixed read-only RPC (strict localhost)
        run: |
          python3 -m unittest discover deploy/scripts/lab/r82 -p test_r82_contract.py -v
          python3 -m py_compile deploy/scripts/lab/r82/virtual_cwmp_http_smoke.py
          bash -n deploy/scripts/lab/r82/virtual-cwmp-http-smoke.sh
          cargo test --locked -p cwmp-gateway
          cargo build --locked -p cwmp-gateway
          IPAT_R82_SYNTHETIC_HTTP=YES bash deploy/scripts/lab/r82/virtual-cwmp-http-smoke.sh
      - name: R8.3 actual interactive private Device Manager add list unknown health via Rust HTTP
        run: |
          python3 -m unittest discover deploy/scripts/lab/r83 -p test_r83_contract.py -v
          node --check web/lab/device-workbench.js
          python3 -m py_compile deploy/scripts/lab/r83/workbench_http_smoke.py
          bash -n deploy/scripts/lab/r83/workbench-http-smoke.sh
          cargo test --locked -p control-api
          cargo build --locked -p control-api
          IPAT_R83_DEMO_HTTP=YES bash deploy/scripts/lab/r83/workbench-http-smoke.sh
      - name: R9.1 adoption readiness source gates remain unmounted and no-probe
        run: python3 -m unittest discover deploy/scripts/lab/r91 -p test_r91_contract.py -v
      - name: R9.2 durable nonexecutable intent remains unmounted and no device I/O
        run: python3 -m unittest discover deploy/scripts/lab/r92 -p test_r92_contract.py -v
      - name: R9.0 no-login public Telnet TCP321 candidate intake (OFFLINE mock only; never contact operator OLT from CI)
        run: |
          python3 -m py_compile deploy/scripts/lab/r90/olt-telnet-network-preflight.py
          python3 -m unittest discover deploy/scripts/lab/r90 -p test_r90_preflight.py -v
          python3 deploy/scripts/lab/r90/olt-telnet-network-preflight.py --requirements | python3 -m json.tool >/dev/null
      - name: R8.4 independently signed MFA claim and separately denied maker-checker review boundary (static)
        run: |
          python3 -m unittest discover deploy/scripts/lab/r84 -p test_r84_contract.py -v
          python3 -m py_compile deploy/db/tests/test_device_maker_checker_integration.py
      - name: R8.5 unprivileged actual original Rust signed OIDC MFA preflight, never real operator rights
        run: |
          python3 -m unittest discover deploy/scripts/lab/r85 -p test_r85_contract.py -v
          cargo test --locked -p identity-core --test oidc_cli
          cargo build --locked -p identity-core --bin oidc-mfa-preflight
          target/debug/oidc-mfa-preflight --requirements
      - name: R8.6 genuine OIDC S256 PKCE browser start/callback consume-once (NO LOGIN)
        run: |
          python3 -m unittest discover deploy/scripts/lab/r86 -p test_r86_contract.py -v
          python3 -m py_compile deploy/scripts/lab/r86/browser_http_smoke.py
          bash -n deploy/scripts/lab/r86/browser-http-smoke.sh
          cargo test --locked -p identity-core
          cargo test --locked -p control-api
          cargo build --locked -p control-api
          IPAT_R86_BROWSER_TEST=YES bash deploy/scripts/lab/r86/browser-http-smoke.sh
      - name: R8.7 offline separate OIDC ID-token nonce at_hash signed access token binding (NO SESSION)
        run: |
          python3 -m unittest discover deploy/scripts/lab/r87 -p test_r87_contract.py -v
          cargo test --locked -p identity-core --test oidc_id_token
      - name: R8.8 genuine signed ID/access-bound opaque browser BFF session primitives OFFLINE ONLY
        run: |
          python3 -m unittest discover deploy/scripts/lab/r88 -p test_r88_contract.py -v
          cargo test --locked -p identity-core --test oidc_id_token
      - name: Verify non-executable sealed provisioning jobs (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_provisioning_synthetic_review.py' -v
      - name: Verify production infrastructure never auto-authorizes unsafe deployment
        run: |
          python3 -m py_compile deploy/scripts/production/readiness.py
          python3 -m unittest discover deploy/scripts/production -p 'test_readiness.py' -v
      - name: Verify disposable physical PostgreSQL restoration contract
        run: |
          bash -n deploy/db/tests/physical_restore_ephemeral.sh
          python3 -m unittest discover deploy/db/tests -p 'test_physical_restore_contract.py' -v
      - name: Verify synthetic PostgreSQL RLS and job/outbox migration safety (static)
        run: |
          python3 -m py_compile deploy/db/tests/test_postgres_rls_integration.py
          python3 -m py_compile deploy/db/tests/test_job_outbox_integration.py
          python3 -m unittest discover deploy/db/tests -p 'test_migration_contract.py' -v
          python3 -m unittest discover deploy/db/tests -p 'test_job_migration_contract.py' -v
      - name: R6.8 three lab dashboard previews, pure scoped policy and real API denial
        run: |
          python3 -m unittest discover deploy/scripts/lab/r68 -p test_dashboard_preview.py -v
          node --check web/lab/dashboard-preview.js
          node deploy/scripts/lab/r68/test_dashboard_preview.mjs
          bash -n deploy/scripts/lab/r68/private-dashboard-http-smoke.sh
          cargo build --locked -p control-api
          IPAT_R68_PRIVATE_HTTP_SMOKE=YES bash deploy/scripts/lab/r68/private-dashboard-http-smoke.sh
      - name: R9.53 combined private domain/C320 operator GUI contracts
        run: |
          node --check web/lab/c320-connection-setup.js
          node --check web/lab/device-workbench.js
          node deploy/scripts/lab/r947/test_add_device.cjs
          node --check web/lab/c320-action-catalog.js
          node deploy/scripts/lab/r960/test_operator_capabilities.cjs
          node --check web/lab/owner-device-inventory.js
          node deploy/scripts/lab/r961/test_owner_inventory_ui.cjs
          node --check web/lab/platform-domain-admin.js
          node --check web/lab/owner-device-inventory.js
          node deploy/scripts/lab/r962/test_catalog_domain_ui.cjs
          node --check web/lab/site-manager.js
          node deploy/scripts/lab/r963/test_standalone_sites.cjs
          python3 -m unittest deploy/scripts/production/test_r963_public_cutover_preflight.py -q
          # R9.79 synthetic negative checks: no owner VPS or public DNS requests.
          python3 -m unittest discover deploy/scripts/production -p test_r979_owner_release_evidence.py -v
          grep -Fq "'public_go': False" deploy/scripts/production/r979_owner_release_evidence.py

          python3 -m py_compile deploy/scripts/production/r963_public_cutover_preflight.py
          bash -n deploy/scripts/lab/r963/rollout-private-sites.sh
          bash -n deploy/scripts/lab/r963/rollout-private-fixed-edit.sh
          node --check deploy/scripts/lab/r963/owner_site_browser_qa.cjs
          bash -n deploy/scripts/lab/r962/rollout_private_master_domain.sh
          node --check deploy/scripts/lab/r962/owner_browser_qa.cjs
          python3 -m py_compile deploy/scripts/lab/r962/owner_domain_preview_smoke.py
          bash -n deploy/scripts/lab/r961/rollout-private-inventory.sh
          python3 -m py_compile deploy/scripts/lab/r961/real-crud-smoke.py
          bash -n deploy/scripts/lab/r960/rollout_private_c320_catalog.sh
          bash -n deploy/scripts/lab/r959/rollout-private-owner-ui.sh
          python3 -m unittest discover deploy/scripts/lab/r959 -p test_owner_enrollment_ux.py -v
          node deploy/scripts/lab/r946/test_device_status.cjs
          python3 -m py_compile deploy/scripts/lab/r945/persistent_c320_connector.py
          python3 -m py_compile deploy/scripts/lab/r945/test_persistent_connector.py
          python3 -m py_compile deploy/scripts/lab/r966/test_private_reader_fallback.py
          python3 -m py_compile deploy/scripts/production/r966_private_reader_preflight.py
          # Private actual owner r938/r940 source NEVER enters Git or CI.
          # Only these synthetic negative tests import the cryptography-backed
          # connector. Real no-network private bundle import was run on the
          # isolated nonroot owner VPS and remains a separate audit gate.
          python3 -c 'import cryptography' || { sudo apt-get update -qq && sudo apt-get install -y python3-cryptography; }
          python3 -m unittest discover deploy/scripts/lab/r966 -p test_private_reader_fallback.py -v
          python3 -m unittest discover deploy/scripts/lab/r945 -p test_persistent_connector.py -v
          grep -Fq 'RECOVERY_R940_SHA256' deploy/scripts/lab/r945/persistent_c320_connector.py
          bash -n deploy/scripts/lab/r953/deploy_private_integrated_preview.sh
          grep -Fq '/lab/domain-settings' apps/control-api/src/device_workbench_lab.rs
          grep -Fq '/lab/c320-owner-connection' apps/control-api/src/c320_live_lab.rs
      - name: R6.9 real pinned RS256 JWT verification and private HTTP business-denial lab
        run: |
          python3 -m unittest discover deploy/scripts/lab/r69 -p test_r69_review.py -v
          bash -n deploy/scripts/lab/r69/oidc-private-http-smoke.sh
          cargo build --locked -p control-api
          IPAT_R69_RUN_SYNTHETIC_HTTP=YES bash deploy/scripts/lab/r69/oidc-private-http-smoke.sh
      - name: R7.7 isolated identity lookup contract (NO production role or public entrypoint)
        run: python3 -m unittest discover deploy/db/tests -p 'test_scoped_identity_lookup_contract.py' -v
      - name: R7.8 private OIDC->Postgres->menu cannot open public/business endpoints
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_private_menu_contract.py' -v
          python3 -m py_compile deploy/db/tests/seed_private_http_identity_ci.py
      - name: R9.16 tenant-domain resolver schema and Rust host canonicalization
        run: |
          python3 -m py_compile deploy/db/tests/test_tenant_domains_integration.py
          cargo test --locked -p control-api tenant_domain::tests
      - name: R9.17 custom-domain enrollment and dashboard source contracts
        run: |
          python3 -m py_compile deploy/db/tests/test_tenant_domain_enrollment_integration.py
          grep -Fq '/v1/domains/instructions' web/lab/domain-settings.js
          grep -Fq 'Simpan domain & buat token verifikasi' web/lab/domain-settings.html
          grep -Fq 'disabled' web/lab/domain-settings.html
          grep -Fq 'safe_to_point_now' web/lab/domain-settings.js
          grep -Fq 'JANGAN POINTING DULU' web/lab/domain-settings.js
      - name: R9.19 domain lifecycle, BFF primitives and dashboard inventory contracts
        run: |
          python3 -m py_compile deploy/db/tests/test_tenant_domain_activation_lifecycle_integration.py
          cargo test --locked -p control-api tenant_domain_bff::tests
          grep -Fq '/v1/tenant/domains' web/lab/domain-settings.js
          grep -Fq 'Domain tenant' web/lab/domain-settings.html
          grep -Fq 'activation_state' web/lab/domain-settings.js
      - name: R9.56 dedicated DNS TXT ownership verifier contracts
        run: |
          cargo test --locked -p control-api tenant_domain_verifier::tests
          python3 -m py_compile deploy/db/tests/test_tenant_domain_dns_verifier_integration.py
