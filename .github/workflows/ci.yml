      - name: R6.6 native CWMP read-only state and actual private HTTP denial smoke
        run: |
          bash -n deploy/scripts/lab/r66/cwmp-loopback-http-smoke.sh
          cargo build --locked -p cwmp-gateway
          IPAT_R66_EXACT_LOOPBACK_SMOKE=YES bash deploy/scripts/lab/r66/cwmp-loopback-http-smoke.sh
