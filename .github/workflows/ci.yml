name: Rust workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust and rustfmt
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Validate lab bootstrap scripts and reviewed root digest
        run: |
          bash -n deploy/scripts/lab/stage1-root-preflight-and-toolchain.sh
          bash -n deploy/scripts/lab/apply-stage1-from-mac.sh
          expected=c2f65afb09d0a8f2509f8e6e27530e5d3d7c1c692f502513835620738414e8e4
          actual="$(sha256sum deploy/scripts/lab/stage1-root-preflight-and-toolchain.sh | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          grep -Fq "$expected" deploy/scripts/lab/apply-stage1-from-mac.sh
      - name: Verify lab Stage-2 static safety contract
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_stage2_review.py' -v
      - name: Verify rootless K3s readiness script (static tests only)
        run: |
          bash -n deploy/scripts/lab/k3s-readonly-preflight.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_readonly_review.py' -v
      - name: Verify disposable Ubuntu 26 K3s isolation contracts
        run: |
          bash -n deploy/scripts/lab/k3s-ubuntu26-ephemeral-ci.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_ubuntu26_ephemeral_review.py' -v
      - name: Verify R5.7 cross-host K3s restore and precise nft rollback contracts
        run: |
          bash -n deploy/scripts/lab/r57/source-systemd-k3s.sh
          bash -n deploy/scripts/lab/r57/restore-systemd-k3s.sh
          bash -n deploy/scripts/lab/r57/nft-rollback-drill.sh
          python3 -m unittest discover deploy/scripts/lab/r57 -p 'test_r57_review.py' -v
      - name: Verify R5.8 private Helm app packaging and fail-closed CI scope
        run: |
          bash -n deploy/scripts/lab/r58/app-smoke.sh
          python3 -m py_compile deploy/scripts/lab/r58/verify-rendered.py
          python3 -m unittest discover deploy/scripts/lab/r58 -p 'test_r58_review.py' -v
      - name: Verify R5.9 SSH-loopback-only web preview and negative deployment guards
        run: |
          bash -n deploy/scripts/lab/r59/start-private-web-mac.sh
          bash -n deploy/scripts/lab/r59/stop-private-web-mac.sh
          python3 -m unittest discover deploy/scripts/lab/r59 -p 'test_r59_review.py' -v
      - name: Verify R6.0 physical-device intake is offline and no compatibility is inferred
        run: |
          python3 -m py_compile deploy/scripts/lab/r60/prepare-device-intake.py
          python3 -m json.tool web/lab/device-targets.json >/dev/null
          python3 -m unittest discover deploy/scripts/lab/r60 -p 'test_r60_review.py' -v
      - name: Verify R6.1 exact owner-reported MikroTik and safe first read-only REST tool
        run: |
          python3 -m py_compile deploy/scripts/lab/r61/readonly-rest-probe.py
          python3 -m unittest discover deploy/scripts/lab/r61 -p 'test_r61*.py' -v
      - name: Verify Mac encrypted-backup and external provider probe safety contracts (static)
        run: |
          bash -n deploy/scripts/lab/backup-mac-restic.sh
          bash -n deploy/scripts/lab/external-readonly-network-check.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_backup_mac_review.py' -v
          python3 -m unittest discover deploy/scripts/lab -p 'test_external_network_review.py' -v
      - name: Verify external provider R4.6 FileVault and dual-stack safety preflight (static)
        run: |
          bash -n deploy/scripts/lab/edge-r46-gate-check.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_edge_r46_gate_review.py' -v
      - name: Verify root-config encrypted stream scripts (static contract)
        run: |
          bash -n deploy/scripts/lab/mac-root-config-backup.sh
          python3 -m py_compile deploy/scripts/lab/root-config-stream.py
          python3 -m unittest discover deploy/scripts/lab -p 'test_root_config_stream_review.py' -v
      - name: Verify sealed offline CWMP admission boundary (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_cwmp_admission_review.py' -v
      - name: Verify synthetic USP Controller sealed trust and loopback only (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_usp_synthetic_review.py' -v
      - name: Verify non-executable sealed provisioning jobs (static)
        run: python3 -m unittest discover deploy/scripts/lab -p 'test_provisioning_synthetic_review.py' -v
      - name: Verify production infrastructure never auto-authorizes unsafe deployment
        run: |
          python3 -m py_compile deploy/scripts/production/readiness.py
          python3 -m unittest discover deploy/scripts/production -p 'test_readiness.py' -v
      - name: Verify disposable physical PostgreSQL restoration contract
        run: |
          bash -n deploy/db/tests/physical_restore_ephemeral.sh
          python3 -m unittest discover deploy/db/tests -p 'test_physical_restore_contract.py' -v
      - name: Verify synthetic PostgreSQL RLS and job/outbox migration safety (static)
        run: |
          python3 -m py_compile deploy/db/tests/test_postgres_rls_integration.py
          python3 -m py_compile deploy/db/tests/test_job_outbox_integration.py
          python3 -m unittest discover deploy/db/tests -p 'test_migration_contract.py' -v
          python3 -m unittest discover deploy/db/tests -p 'test_job_migration_contract.py' -v
      - name: R6.8 three lab dashboard previews, pure scoped policy and real API denial
        run: |
          python3 -m unittest discover deploy/scripts/lab/r68 -p test_dashboard_preview.py -v
          node --check web/lab/dashboard-preview.js
          node deploy/scripts/lab/r68/test_dashboard_preview.mjs
          bash -n deploy/scripts/lab/r68/private-dashboard-http-smoke.sh
          cargo build --locked -p control-api
          IPAT_R68_PRIVATE_HTTP_SMOKE=YES bash deploy/scripts/lab/r68/private-dashboard-http-smoke.sh
      - name: R6.9 real pinned RS256 JWT verification and private HTTP business-denial lab
        run: |
          python3 -m unittest discover deploy/scripts/lab/r69 -p test_r69_review.py -v
          bash -n deploy/scripts/lab/r69/oidc-private-http-smoke.sh
          cargo build --locked -p control-api
          IPAT_R69_RUN_SYNTHETIC_HTTP=YES bash deploy/scripts/lab/r69/oidc-private-http-smoke.sh
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run locked unit tests
        run: cargo test --workspace --locked
      - name: Verify R7.1 ZTE C320 read-only parsing and prominent PRD risk banner
        run: |
          python3 -m unittest discover deploy/scripts/lab/r71 -p test_r71_contract.py -v
          cargo test --locked -p olt-core --test c320_fixture
          cargo build --locked -p olt-core --bin c320-offline-review
          python3 -m unittest discover deploy/scripts/lab/r71 -p test_r71_offline_cli.py -v
      - name: Verify R7.2 C320 local firmware SHA256 without physical connectivity or upgrade
        run: |
          python3 -m py_compile deploy/scripts/lab/r72/c320-firmware-check.py
          python3 -m unittest discover deploy/scripts/lab/r72 -p test_c320_firmware_hash.py -v
          python3 deploy/scripts/lab/r72/c320-firmware-check.py --requirements
      - name: R6.6 native CWMP read-only state and actual private HTTP denial smoke
        run: |
          bash -n deploy/scripts/lab/r66/cwmp-loopback-http-smoke.sh
          cargo build --locked -p cwmp-gateway
          IPAT_R66_EXACT_LOOPBACK_SMOKE=YES bash deploy/scripts/lab/r66/cwmp-loopback-http-smoke.sh
      - name: R6.7 genuine ephemeral TLS 1.3 client-mTLS handshake and negative identity proof
        run: |
          bash -n deploy/scripts/lab/r67/mtls-loopback-contract.sh
          python3 -m unittest discover deploy/scripts/lab/r67 -p test_r67_review.py -v
          cargo build --locked -p cwmp-gateway --bin cwmp-mtls-lab
          IPAT_R67_RUN_SYNTHETIC_MTLS_TEST=YES bash deploy/scripts/lab/r67/mtls-loopback-contract.sh
      - name: Verify R6.2 Rust domain and Python first-read evidence contract without equipment
        run: |
          bash -n deploy/scripts/lab/r62/synthetic-cross-contract.sh
          bash deploy/scripts/lab/r62/synthetic-cross-contract.sh
      - name: Verify R6.4 simulated SSH output to Rust strict evidence contract
        run: |
          bash -n deploy/scripts/lab/r64/synthetic-ssh-cross-contract.sh
          bash deploy/scripts/lab/r64/synthetic-ssh-cross-contract.sh
      - name: Verify R6.3 SSH host identity mismatch fails closed without login
        run: |
          python3 -m py_compile deploy/scripts/lab/r63/ssh-host-trust-check.py
          python3 -m unittest discover deploy/scripts/lab/r63 -p 'test_r63_review.py' -v
      - name: Verify R6.4 single-device SSH identity lock and negative path
        run: |
          python3 -m py_compile deploy/scripts/lab/r64/ssh-first-read.py
          python3 -m unittest discover deploy/scripts/lab/r64 -p 'test_r64_review.py' -v


  postgres-rls-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_DB: ipat_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipat_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      IPAT_PG_EPHEMERAL_TEST: "1"
      IPAT_PG_SYNTHETIC_PASSWORD: local_ci_synthetic_only
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: ipat_synthetic
      PGUSER: postgres
      PGPASSWORD: local_ci_synthetic_only
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install synthetic PostgreSQL client utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql --version
      - name: Validate tenant RLS and separate new-database logical restore (synthetic ONLY)
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_postgres_rls_integration.py' -v
      - name: Validate synthetic durable job state and transactional outbox (ephemeral ONLY)
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_job_outbox_integration.py' -v
      - name: Verify R7.0 unexposed approved tenant membership and POP candidate schema
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_identity_memberships_integration.py' -v

# Separate disposable CI runner and PostgreSQL server process.
  # This rehearses a physical base backup; it is NOT production PITR/offsite HA.
  postgres-physical-recovery-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_DB: ipat_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipat_synthetic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      IPAT_PG_EPHEMERAL_TEST: "1"
      IPAT_PG_SYNTHETIC_PASSWORD: local_ci_synthetic_only
      PGHOST: 127.0.0.1
      PGPORT: "5432"

      PGDATABASE: ipat_synthetic
      PGUSER: postgres
      PGPASSWORD: local_ci_synthetic_only
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install isolated PostgreSQL 16 runner binaries without an auto-created cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y postgresql-16
          /usr/lib/postgresql/16/bin/pg_ctl --version
      - name: Seed original synthetic RLS and job/outbox fixtures
        run: |
          python3 -m unittest discover deploy/db/tests -p 'test_postgres_rls_integration.py' -v
          python3 -m unittest discover deploy/db/tests -p 'test_job_outbox_integration.py' -v
      - name: Verify synthetic physical basebackup and restore on separate CI server process
        run: bash deploy/db/tests/physical_restore_ephemeral.sh

# Real single-node K3s runs ONLY on a freshly provisioned, disposable
  # GitHub-hosted Ubuntu 26.04 VM. It NEVER installs on the IPAT VPS.
  k3s-ubuntu26-disposable:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      IPAT_K3S_DISPOSABLE_LAB: "1"
      IPAT_R58_SMOKE: "1"
    steps:
      - name: Check out sources (pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare disposable Rust/musl, checksum-pinned Helm and local-only manifest tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools python3-yaml
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.98.1
          helm_temp="$(mktemp -d /tmp/ipat-r58-helm.XXXXXXXX)"
          trap 'rm -rf "$helm_temp"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz \
            -o "$helm_temp/helm.tar.gz"
          printf '%s  %s\n' \
            15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0 \
            "$helm_temp/helm.tar.gz" | sha256sum --check --status
          tar -xz -C "$helm_temp" -f "$helm_temp/helm.tar.gz" linux-amd64/helm
          sudo install -m 0755 "$helm_temp/linux-amd64/helm" /usr/local/bin/helm
          helm lint deploy/helm/ipat-lab
          python3 -m unittest discover deploy/scripts/lab/r58 -p test_r58_manifest.py -v
      - name: Verify pinned K3s CI safety before any root action
        run: |
          bash -n deploy/scripts/lab/k3s-ubuntu26-ephemeral-ci.sh
          python3 -m unittest discover deploy/scripts/lab -p 'test_k3s_ubuntu26_ephemeral_review.py' -v
      - name: Install and smoke-test checksum-pinned K3s on disposable Ubuntu 26.04
        run: |
          timeout --signal=TERM --kill-after=15s 1200s bash             deploy/scripts/lab/k3s-ubuntu26-ephemeral-ci.sh
